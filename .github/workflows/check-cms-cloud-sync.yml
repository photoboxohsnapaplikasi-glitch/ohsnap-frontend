name: Cek Sinkronisasi cms-cloud.js

on:
  push:
    branches: [ main ]
    paths:
      - 'cms-cloud.js'
      - '.github/workflows/check-cms-cloud-sync.yml'
  workflow_dispatch:

jobs:
  verify-cms-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository ini
        uses: actions/checkout@v4

      - name: Bandingkan checksum cms-cloud.js dengan repo pasangan
        run: |
          LOCAL_HASH=$(tr -d '\r' < cms-cloud.js | sha256sum | awk '{print $1}')
          echo "SHA256 lokal cms-cloud.js: $LOCAL_HASH"
          if [ "${{ github.repository }}" = "${{ github.repository_owner }}/ohsnap-admin" ]; then
            PAIR_REPO="ohsnap-frontend"
          else
            PAIR_REPO="ohsnap-admin"
          fi
          PAIR_URL="https://api.github.com/repos/${{ github.repository_owner }}/${PAIR_REPO}/contents/cms-cloud.js?ref=main"
          curl -sfL -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" "$PAIR_URL" -o /tmp/pair-cms-cloud.js || { echo "Repo pasangan belum bisa diakses publik, melewati perbandingan."; exit 0; }
          PAIR_HASH=$(tr -d '\r' < /tmp/pair-cms-cloud.js | sha256sum | awk '{print $1}')
          echo "SHA256 pasangan (${PAIR_REPO}) cms-cloud.js: $PAIR_HASH"
          if [ "$LOCAL_HASH" != "$PAIR_HASH" ]; then
            echo "::warning::cms-cloud.js berbeda dengan ${PAIR_REPO}! Pastikan kedua repo memakai versi cms-cloud.js yang sama."
            exit 1
          fi
          echo "cms-cloud.js identik di kedua repository."